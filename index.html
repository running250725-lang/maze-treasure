<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해치의 연말 트리 꾸미기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#28140c;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#342015}
.app{max-width:601px;margin:auto;background:#512b1b;min-height:100vh}
.board{position:relative;width:100%;aspect-ratio:601/517;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.counter{position:absolute;left:77.5%;top:35.1%;width:20%;height:7.5%;z-index:5;display:flex;align-items:center;justify-content:center;background:transparent;font-weight:1000;font-size:clamp(19px,5vw,31px);line-height:1;color:#111}
.orn{position:absolute;z-index:6;opacity:0;transform:scale(.35);transition:opacity .3s,transform .45s cubic-bezier(.2,1.7,.4,1);object-fit:contain;background:transparent!important}.orn.on{opacity:1;transform:scale(1)}
#o1{left:43.5%;top:45.2%;width:11.0%}#o2{left:52.0%;top:54.2%;width:10.0%}#o3{left:35.6%;top:64.2%;width:12.5%}#o4{left:53.0%;top:71.8%;width:9.4%}#o5{left:42.7%;top:79.7%;width:11.5%}
.complete{display:none;position:absolute;left:19%;right:25%;bottom:2.5%;z-index:10;background:#fff7dcf2;border:3px solid #dfa342;border-radius:15px;padding:7px 8px;text-align:center;color:#c9232e;font-weight:1000;font-size:clamp(10px,2.6vw,15px);box-shadow:0 4px 10px #0004}
.controls{padding:12px;background:linear-gradient(#f1d8a9,#e3b878);text-align:center}.preview{border:1px dashed #98632d;background:#fff8e9;border-radius:9px;padding:7px 12px;color:#70461f;font-size:10px}
.steps{display:none;padding:0 14px 25px;background:linear-gradient(#e3b878,#c78345)}.steps.show{display:block}.card{background:#fff8e9;border:3px solid #dca247;border-radius:19px;padding:17px 14px;margin-bottom:12px;text-align:center}.badge{display:inline-block;background:#d72731;color:#fff;border-radius:99px;padding:5px 12px;font-size:10px;font-weight:900}.card h2{margin:8px 0}.card p{font-size:12px;line-height:1.6;color:#69584b}.naver,.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;font-weight:1000;color:#fff;text-decoration:none}.naver{background:#03c75a}.btn{background:#dc2530;margin-top:8px}.pw{width:100%;border:2px solid #ddd;border-radius:12px;padding:13px;text-align:center;font-size:20px;letter-spacing:8px}.draw{display:none}.draw.show{display:block}.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.gift{border:0;background:#f0d5a0;border-radius:12px;padding:10px 0;font-size:34px}.err{font-size:11px;color:#b00020;margin-top:6px}
.result{display:none;position:fixed;inset:0;background:#1a0d07e9;z-index:30;align-items:center;justify-content:center;padding:20px}.resultbox{width:min(360px,92vw);background:#fff6df;border:4px solid #dfa746;border-radius:25px;padding:27px;text-align:center}.rico{font-size:70px}.won{font-size:25px;font-weight:1000;color:#c72730;margin:13px}
</style></head><body><main class="app">
<div class="board"><img class="bg" src="assets/game-board.png" alt="해치의 연말 트리 꾸미기">
<div class="counter"><span id="num">0</span>/5</div>
<img class="orn" id="o1" src="assets/star.png"><img class="orn" id="o2" src="assets/bell.png"><img class="orn" id="o3" src="assets/ribbon.png"><img class="orn" id="o4" src="assets/candy.png"><img class="orn" id="o5" src="assets/gift.png">
<div class="complete" id="complete">🎄 해치의 연말 트리 완성!<br><small>5가지 장식을 모두 찾았어요!</small></div></div>
<div class="controls"><button class="preview" id="preview" onclick="testAdd()">미리보기 · 다음 장식 발견</button></div>
<section class="steps" id="steps">
<div class="card"><span class="badge">STEP 1</span><h2>네이버 리뷰 작성하기</h2><p>오늘 체험에 대한 솔직한 후기를 자유롭게 남겨주세요.<br>작성 후 실제 리뷰 화면을 직원에게 보여주세요.</p><a class="naver" href="https://m.place.naver.com/my" target="_blank">N 네이버 리뷰 쓰러가기 ›</a></div>
<div class="card"><span class="badge">STEP 2</span><h2>직원에게 인증하기</h2><p>작성한 리뷰 화면을 매표소 직원에게 보여주세요.</p><input class="pw" id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="btn" onclick="unlock()">확인하기 ›</button><div class="err" id="err"></div></div>
<div class="card draw" id="draw"><span class="badge">STEP 3</span><h2>행운의 선물상자 뽑기!</h2><p>마음에 드는 상자 하나를 골라주세요. 선택은 단 한 번!</p><div class="boxes"><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button></div></div>
</section></main>
<div class="result" id="result"><div class="resultbox"><div class="rico" id="rico">🎉</div><h2>선물상자 OPEN!</h2><div class="won" id="won"></div><p>이 화면을 직원에게 보여주세요.</p><b>✓ 당첨 완료 · 재추첨 불가</b></div></div>
<script>
const K="HAECHI_GRAPHIC_GAME_V4",P=[["상품 1","🎁"],["상품 2","🎉"],["상품 3","⭐"],["상품 4","🍀"],["상품 5","🎀"]];
let d={got:[],ok:false,result:null};try{d=Object.assign(d,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}const save=()=>localStorage.setItem(K,JSON.stringify(d));
let q=Number(new URLSearchParams(location.search).get("ornament"));if(q>=1&&q<=5&&!d.got.includes(q)){d.got.push(q);save()}
function render(){num.textContent=d.got.length;for(let i=1;i<=5;i++)if(d.got.includes(i))document.getElementById("o"+i).classList.add("on");if(d.got.length===5){complete.style.display="block";steps.classList.add("show");preview.style.display="none"}if(d.ok)draw.classList.add("show");if(d.result)show(d.result)}
function testAdd(){for(let i=1;i<=5;i++)if(!d.got.includes(i)){d.got.push(i);save();render();break}}
function unlock(){if(pw.value==="0725"){d.ok=true;save();err.textContent="✓ 직원 인증 완료";draw.classList.add("show");draw.scrollIntoView({behavior:"smooth"})}else err.textContent="비밀번호가 맞지 않습니다."}
function pick(){if(!d.ok||d.result)return;let p=P[Math.floor(Math.random()*P.length)];d.result={name:p[0],icon:p[1]};save();show(d.result)}
function show(r){rico.textContent=r.icon;won.textContent=r.name+" 당첨!";result.style.display="flex"}render();
</script></body></html>
