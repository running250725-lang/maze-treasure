<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해치의 연말 트리 꾸미기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#28140c;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#342015}
.app{max-width:601px;margin:auto;background:#512b1b;min-height:100vh}.board{position:relative;width:100%;aspect-ratio:601/517;overflow:hidden}.board>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.counter{position:absolute;left:78.4%;top:36.1%;width:13%;height:8%;background:#fff2d4;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(18px,5vw,32px);z-index:4}
.orn{position:absolute;z-index:5;opacity:0;transform:scale(.3);transition:.42s cubic-bezier(.2,1.7,.4,1);object-fit:contain}.orn.on{opacity:1;transform:scale(1)}
/* positions exactly over the grey silhouettes in the supplied artwork */
#o1{left:45.4%;top:47.0%;width:8.5%}#o2{left:54.3%;top:56.2%;width:7.4%}#o3{left:38.1%;top:66.7%;width:10.0%}#o4{left:55.1%;top:73.0%;width:6.8%}#o5{left:45.0%;top:82.1%;width:8.8%}
.tick{position:absolute;z-index:6;right:3.7%;font-size:clamp(17px,4vw,28px);opacity:0;transition:.3s}.tick.on{opacity:1}.t1{top:46.1%}.t2{top:55.5%}.t3{top:65.2%}.t4{top:75.0%}.t5{top:84.0%}
.toast{display:none;position:absolute;left:20%;right:20%;bottom:4%;z-index:10;background:#fff8dd;border:3px solid #e4aa42;border-radius:16px;padding:9px;text-align:center;font-weight:1000;color:#c72730;box-shadow:0 5px 15px #0005}
.controls{padding:15px;background:linear-gradient(#f4ddb2,#e5bd7c)}.preview{display:block;margin:auto;border:1px dashed #9d682b;background:#fff8e9;border-radius:10px;padding:8px 13px;color:#71451e;font-size:11px}
.steps{display:none;padding:0 15px 25px;background:linear-gradient(#e5bd7c,#c98748)}.steps.show{display:block}.card{background:#fff8e9;border:3px solid #dfa84e;border-radius:20px;padding:18px 15px;margin-bottom:12px;text-align:center;box-shadow:0 6px 15px #5e321b33}.badge{display:inline-block;background:#d72731;color:#fff;border-radius:99px;padding:5px 13px;font-size:11px;font-weight:900}.card h2{margin:9px 0}.card p{font-size:12px;line-height:1.6;color:#68574b}.naver,.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;font-weight:1000;color:#fff;text-decoration:none}.naver{background:#03c75a}.btn{background:#dc2530;margin-top:8px}.pw{width:100%;border:2px solid #ddd;border-radius:12px;padding:13px;text-align:center;font-size:20px;letter-spacing:8px}.draw{display:none}.draw.show{display:block}.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.gift{border:0;background:#f0d5a0;border-radius:12px;padding:10px 0;font-size:34px}.result{display:none;position:fixed;inset:0;background:#1a0d07e9;z-index:30;align-items:center;justify-content:center;padding:20px}.resultbox{width:min(360px,92vw);background:#fff6df;border:4px solid #dfa746;border-radius:25px;padding:27px;text-align:center}.rico{font-size:70px}.won{font-size:25px;font-weight:1000;color:#c72730;margin:13px}.err{font-size:11px;color:#b00020;margin-top:6px}
</style></head><body><main class="app">
<div class="board"><img class="bg" src="assets/game-board.png">
<div class="counter"><span id="num">0</span>/5</div>
<img class="orn" id="o1" src="assets/star.png"><img class="orn" id="o2" src="assets/bell.png"><img class="orn" id="o3" src="assets/ribbon.png"><img class="orn" id="o4" src="assets/candy.png"><img class="orn" id="o5" src="assets/gift.png">
<div class="tick t1" id="t1">✓</div><div class="tick t2" id="t2">✓</div><div class="tick t3" id="t3">✓</div><div class="tick t4" id="t4">✓</div><div class="tick t5" id="t5">✓</div>
<div class="toast" id="toast">🎄 해치의 연말 트리 완성!<br><small>5가지 장식을 모두 찾았어요!</small></div></div>
<div class="controls"><button class="preview" id="preview" onclick="testAdd()">미리보기 · 다음 장식 발견</button></div>
<section class="steps" id="steps">
<div class="card"><span class="badge">STEP 1</span><h2>네이버 리뷰 작성하기</h2><p>오늘 체험에 대한 솔직한 후기를 자유롭게 남겨주세요.<br>작성 후 실제 리뷰 화면을 직원에게 보여주세요.</p><a class="naver" href="https://m.place.naver.com/my" target="_blank">N 네이버 리뷰 쓰러가기 ›</a></div>
<div class="card"><span class="badge">STEP 2</span><h2>직원에게 인증하기</h2><p>작성한 리뷰 화면을 매표소 직원에게 보여주세요.</p><input class="pw" id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><button class="btn" onclick="unlock()">확인하기 ›</button><div class="err" id="err"></div></div>
<div class="card draw" id="draw"><span class="badge">STEP 3</span><h2>행운의 선물상자 뽑기!</h2><p>마음에 드는 상자 하나를 골라주세요. 선택은 단 한 번!</p><div class="boxes"><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button><button class="gift" onclick="pick()">🎁</button></div></div>
</section></main>
<div class="result" id="result"><div class="resultbox"><div class="rico" id="rico">🎉</div><h2>선물상자 OPEN!</h2><div class="won" id="won"></div><p>이 화면을 직원에게 보여주세요.</p><b>✓ 당첨 완료 · 재추첨 불가</b></div></div>
<script>
const K="HAECHI_GRAPHIC_GAME_V1",P=[["상품 1","🎁"],["상품 2","🎉"],["상품 3","⭐"],["상품 4","🍀"],["상품 5","🎀"]];
let d={got:[],ok:false,result:null};try{d=Object.assign(d,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}const save=()=>localStorage.setItem(K,JSON.stringify(d));
let q=Number(new URLSearchParams(location.search).get("ornament"));if(q>=1&&q<=5&&!d.got.includes(q)){d.got.push(q);save()}
function render(){num.textContent=d.got.length;for(let i=1;i<=5;i++)if(d.got.includes(i)){document.getElementById("o"+i).classList.add("on");document.getElementById("t"+i).classList.add("on")}if(d.got.length===5){toast.style.display="block";steps.classList.add("show");preview.style.display="none"}if(d.ok)draw.classList.add("show");if(d.result)show(d.result)}
function testAdd(){for(let i=1;i<=5;i++)if(!d.got.includes(i)){d.got.push(i);save();render();break}}
function unlock(){if(pw.value==="0725"){d.ok=true;save();err.textContent="✓ 직원 인증 완료";draw.classList.add("show");draw.scrollIntoView({behavior:"smooth"})}else err.textContent="비밀번호가 맞지 않습니다."}
function pick(){if(!d.ok||d.result)return;let p=P[Math.floor(Math.random()*P.length)];d.result={name:p[0],icon:p[1]};save();show(d.result)}
function show(r){rico.textContent=r.icon;won.textContent=r.name+" 당첨!";result.style.display="flex"}render();
</script></body></html>
